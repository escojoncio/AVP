# AVP (Half-Life: Alyx on Apple Vision Pro) as an XcodeGen project: `xcodegen generate` writes
# AVP.xcodeproj. Built by .github/workflows/visionos.yml, which first makes
# klepton/build/xros/libklepton.a (Klepton's runtime), build/deps (LuaJIT, SDL3 + sdl2-compat,
# Fossilize), MoltenVK, build/VPVulkan.framework and the patched VPKEngine checkout (vpkengine/).
name: AVP
options:
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  AVP:
    type: application
    platform: visionOS
    scheme: {}
    sources:
      - path: app/Sources
      - path: app/Native
      - path: app/Steam/SteamLauncherKit
      - path: app/Steam/CSteamSupport
        compilerFlags: ["-DZSTD_NO_TRACE", "-w"]
        excludes:
          - "**/*.h"
          - "**/LICENSE*"
          - "**/*.txt"
      - path: app/Resources
        buildPhase: resources
      - path: klepton/visionos/Sources
        excludes:
          - "*.h"
      - path: klepton/tools/klepton_ld.c
        compilerFlags: ["-DKLEPTON_LD_INPROC", "-Wno-unused-function"]
      - path: vpkengine/runtime/vp_codesign.c
      - path: vpkengine/runtime/vp_pkcs12.c
      - path: build/VPKEngineCertificates
        type: folder
        buildPhase: resources
    dependencies:
      - framework: klepton/vendor-moltenvk/out/xros/MoltenVK.framework
        embed: true
        link: false
        codeSign: true
      - framework: build/VPVulkan.framework
        embed: true
        link: false
        codeSign: true
      - framework: build/deps/Frameworks/SDL3.framework
        embed: true
        codeSign: true
      - framework: build/deps/Frameworks/SDL2.framework
        embed: true
        link: false
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: AVP
        PRODUCT_BUNDLE_IDENTIFIER: com.kdt.livecontainer
        INFOPLIST_FILE: klepton/visionos/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AVP
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        CODE_SIGN_ENTITLEMENTS: app/AVP.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: klepton/visionos/Sources/Klepton-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS:
          - $(inherited)
          - KL_APP_ALYX
          - KL_ALYX_LAUNCHER
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - KL_APP_ALYX=1
          - KL_ALYX_LAUNCHER=1
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/klepton/runtime
          - $(SRCROOT)/klepton/runtime/linux
          - $(SRCROOT)/klepton/runtime/openvr
          - $(SRCROOT)/klepton/runtime/openvr/src
          - $(SRCROOT)/klepton/runtime/jni
          - $(SRCROOT)/klepton/runtime/libc
          - $(SRCROOT)/klepton/runtime/gfx
          - $(SRCROOT)/klepton/runtime/xr
          - $(SRCROOT)/klepton/runtime/media
          - $(SRCROOT)/klepton/runtime/guest
          - $(SRCROOT)/klepton/runtime/diag
          - $(SRCROOT)/klepton/visionos/Sources
          - $(SRCROOT)/klepton/vendor-moltenvk/out/include
          - $(SRCROOT)/build/deps/include
          - $(SRCROOT)/app/Native
          - $(SRCROOT)/app/Steam/CSteamSupport/include
          - $(SRCROOT)/app/Steam/CSteamSupport/lzma
          - $(SRCROOT)/app/Steam/CSteamSupport/zstd
          - $(SRCROOT)/vpkengine/runtime
          - $(inherited)
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build/deps/Frameworks
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/klepton/build/xros
          - $(SRCROOT)/build/deps/lib
        OTHER_LDFLAGS:
          - -lklepton
          - -lluajit
          - -lfossilize
          - -lc++
          - -liconv
          - -lz
          - -lcompression
          - -framework Metal
          - -framework MetalFX
          - -framework QuartzCore
          - -framework CompositorServices
          - -framework ARKit
          - -framework GameController
          - -framework CoreHaptics
          - -framework AudioToolbox
          - -framework AVFoundation
          - -framework VideoToolbox
          - -framework CoreMedia
          - -framework CoreVideo
          - -framework IOSurface
          - -framework Security
          - -framework CoreFoundation
          - -framework Foundation
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        ENABLE_BITCODE: NO
        SUPPORTED_PLATFORMS: "xros"
        TARGETED_DEVICE_FAMILY: "7"
